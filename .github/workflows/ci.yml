name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      # The suite mocks the LLMs, the embedding model and all external HTTP,
      # so it needs no secrets or network.
      - run: python -m pytest -q

  frontend:
    name: Frontend tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Runs the one-command start the README gives reviewers, with each runner's
  # preinstalled Python and Node, and checks the app answers at one URL.
  start-script:
    name: One-command start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Start with start.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./start.sh > start.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:8000/api/health; then break; fi
            sleep 5
          done
          curl -sf http://localhost:8000/api/health || { cat start.log; exit 1; }
          curl -sf http://localhost:8000/ | grep -q '<div id="root">' || { cat start.log; exit 1; }
      - name: Start with start.ps1 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process powershell -PassThru -NoNewWindow `
            -ArgumentList "-ExecutionPolicy", "Bypass", "-File", "start.ps1" `
            -RedirectStandardOutput start.log -RedirectStandardError start.err
          $healthy = $false
          for ($i = 0; $i -lt 180 -and -not $proc.HasExited; $i++) {
            try {
              Invoke-RestMethod http://localhost:8000/api/health | Out-Null
              $healthy = $true
              break
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if ($healthy) {
            $page = Invoke-WebRequest http://localhost:8000/ -UseBasicParsing
            $healthy = $page.Content -match '<div id="root">'
          }
          if (-not $healthy) {
            Get-Content start.log, start.err -ErrorAction SilentlyContinue
            exit 1
          }
